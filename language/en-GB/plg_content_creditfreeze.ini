PLG_CONTENT_CREDITFREEZE="Content - Credit Freeze Letters for Joomla"
PLG_CONTENT_CREDITFREEZE_XML_DESCRIPTION="Type {credit_freeze} in any article and a working credit freeze letter generator appears there. Writes the mail-in letters all three US credit bureaus require, including the protected-consumer freeze placed under a power of attorney or guardianship. Runs entirely in the visitor's browser and sends nothing to any server."
PLG_CONTENT_CREDITFREEZE_SHOWCREDIT_LABEL="Show credit line"
PLG_CONTENT_CREDITFREEZE_SHOWCREDIT_DESC="Shows a one line credit under the disclaimer naming the author with a link. It is a request rather than a licence condition, so you may turn it off. The disclaimer itself always stays."
PLG_CONTENT_CREDITFREEZE_BRAND_LABEL="Button and accent colour"
PLG_CONTENT_CREDITFREEZE_BRAND_DESC="Any CSS colour. Leave empty to use the widget default."
PLG_CONTENT_CREDITFREEZE_TEXT_LABEL="Body text colour"
PLG_CONTENT_CREDITFREEZE_MUTED_LABEL="Muted text colour"
PLG_CONTENT_CREDITFREEZE_LINE_LABEL="Border colour"
